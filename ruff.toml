target-version = "py310"
line-length = 100
src = ["src", "tests"]

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[lint.per-file-ignores]
"tests/**/*.py" = ["N802", "N803", "N806"]  # allow non-snake_case in tests
# typer's canonical API puts Argument/Option calls in parameter defaults;
# B008 (no function calls in defaults) is a false positive for that idiom.
"src/bitfrost/cli.py" = ["B008"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
