[tox]
envlist = py310, py311, py312, py313, lint, typecheck
isolated_build = True

[testenv]
extras = dev
commands =
    pytest tests/ --cov=src/bitfrost --cov-report=term-missing --cov-fail-under=85

[testenv:lint]
deps = ruff>=0.6
commands =
    ruff check .
    ruff format --check .

[testenv:typecheck]
deps =
    mypy>=1.10
    opentelemetry-api>=1.27
    opentelemetry-sdk>=1.27
commands =
    mypy src/bitfrost
