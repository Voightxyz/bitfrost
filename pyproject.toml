[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitfrost"
version = "0.1.0a1"
description = "Drop-in OpenTelemetry observability for Python LLM apps. Standalone or with any OTLP backend."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Voight", email = "hello@voight.xyz" },
]
keywords = [
    "opentelemetry",
    "otel",
    "observability",
    "llm",
    "gen-ai",
    "openai",
    "anthropic",
    "smolagents",
    "litellm",
    "tracing",
    "monitoring",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
http = [
    "httpx>=0.24,<1.0",
]
rich = [
    "rich>=13.0",
]
cli = [
    "typer>=0.12",
    "rich>=13.0",
]
serve = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "rich>=13.0",
]
all = [
    "bitfrost[http,rich,cli,serve]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://voight.xyz"
Documentation = "https://docs.voight.xyz/python/bitfrost"
Repository = "https://github.com/Voightxyz/bitfrost"
Issues = "https://github.com/Voightxyz/bitfrost/issues"
Changelog = "https://github.com/Voightxyz/bitfrost/blob/main/CHANGELOG.md"

[project.scripts]
bitfrost = "bitfrost.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bitfrost"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/bitfrost"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false

[tool.coverage.paths]
source = ["src", ".tox/*/lib/python*/site-packages"]
